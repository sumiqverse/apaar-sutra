name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apaar_user
          POSTGRES_PASSWORD: apaar_secure_password_2026
          POSTGRES_DB: apaar_sutra_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint
        run: |
          ruff check backend/

      - name: Run Mypy Type Checking
        run: |
          mypy backend/app --ignore-missing-imports

      - name: Run Pytest Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://apaar_user:apaar_secure_password_2026@localhost:5432/apaar_sutra_db
          DATABASE_ASYNC_URL: postgresql+asyncpg://apaar_user:apaar_secure_password_2026@localhost:5432/apaar_sutra_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-lint-and-test:
    name: Frontend Vitest, Build & Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          npm install

      - name: Run Vitest Suite
        run: |
          npm run test

      - name: Verify TypeScript & Production Build
        run: |
          npm run build

      - name: Run Playwright E2E Tests (Headless)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium

  docker-compose-build:
    name: Multi-Stage Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration & Build Images
        run: |
          cp .env.example .env
          docker compose config
          docker compose build --parallel
