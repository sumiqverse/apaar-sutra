version: "3.9"

services:
  # --- Reverse Proxy & TLS Gateway ---
  nginx:
    image: nginx:1.25-alpine
    container_name: apaar-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  # --- Relational Database: PostgreSQL 16 Hardened ---
  postgres:
    image: postgres:16-alpine
    container_name: apaar-postgres-prod
    restart: unless-stopped
    user: "postgres"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "1.0"
          memory: 2048M

  # --- Cache & Broker: Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: apaar-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-apaar_redis_sec_2026}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-apaar_redis_sec_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 512M

  # --- API Core: FastAPI (Non-Root UID 10001, Read-Only FS) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-backend-prod
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    env_file:
      - .env.production
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M

  # --- Asynchronous Celery Workers ---
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-celery-worker-prod
    restart: unless-stopped
    user: "10001:10001"
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=8", "-E"]
    tmpfs:
      - /tmp:size=512M,mode=1777
    env_file:
      - .env.production
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "1.0"
          memory: 2048M

  # --- Celery Beat Periodic Scheduler ---
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-celery-beat-prod
    restart: unless-stopped
    user: "10001:10001"
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    tmpfs:
      - /tmp:size=128M,mode=1777
    env_file:
      - .env.production
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # --- Frontend SPA (Static Nginx unprivileged) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apaar-frontend-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # --- Observability Profile: Prometheus ---
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: apaar-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  # --- Observability Profile: Grafana ---
  grafana:
    image: grafana/grafana:10.4.3
    container_name: apaar-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_secure_pass_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  postgres_prod_data:
  redis_prod_data:
  certbot_data:
  prometheus_data:
  grafana_data:
