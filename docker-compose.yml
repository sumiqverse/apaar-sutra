version: "3.9"

services:
  # --- Relational Database: PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: apaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apaar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apaar_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-apaar_sutra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apaar_user} -d ${POSTGRES_DB:-apaar_sutra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Cache & Message Broker: Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: apaar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- API Layer: FastAPI Application ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Asynchronous Worker: Celery ---
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Periodic Scheduler: Celery Beat ---
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; exit(0 if os.path.exists(\"/tmp/celerybeat.pid\") else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Single Page Application: React 18 / Vite / Nginx ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apaar-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # --- Edge Gateway / Reverse Proxy: Nginx ---
  nginx:
    image: nginx:1.25-alpine
    container_name: apaar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: apaar_postgres_data
  redis_data:
    name: apaar_redis_data
